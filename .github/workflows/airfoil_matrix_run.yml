# Locked target: run the 91 UIUC airfoils in tests/fixtures/real_uiuc/
# that haven't been run through the pipeline yet (per the local
# .orchestrator_runs/real_uiuc_35 manifest, computed 2026-09-15), each
# as its own matrix job on a native-Linux runner, natively (no WSL --
# see pipeline/_shell.py). Excludes 30p-30n/-flap/-slat (a multi-element
# geometry Stage 0's own self-intersection guard already rejects,
# documented in STATUS.md -- including it would just be 3 expected red
# X's, not new signal).
#
# A per-airfoil job is green if the pipeline ran without an unhandled
# exception -- NOT "did this airfoil's AoA sweep converge". A
# geometry_mesh rejection or a non-converged AoA is real, expected
# production data (see scripts/ci_run_airfoil.py's own docstring), not
# an infra failure -- failing the job on every such case would bury 91
# jobs' worth of real signal under red X's.
#
# max-parallel: 20 assumes a GitHub Free-plan concurrency cap (personal
# account) -- raise if the account is actually Pro/Team/Enterprise.
name: Airfoil corpus matrix run (remaining UIUC batch)

on:
  workflow_dispatch: {}

jobs:
  run-airfoil:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        airfoil: ["ag08", "ag09", "ag10", "ag11", "ag12", "ag13", "ag14", "ag16", "ag17", "ag18", "ag19", "ag23", "ag25", "ag26", "ag27", "ag36", "ag37", "ag38", "ag44ct02r", "ag455ct02r", "ag45c03", "ag45ct02r", "ag46c03", "ag46ct02r", "ag47c03", "ag47ct02r", "ag52", "ag53", "ag54", "ag55", "ah21-7", "ah21-9", "ah63k127", "ah6407", "ah7476", "ah79100a", "ah79100b", "ah79k132", "ah79k135", "ah79k143", "ah80129", "ah80136", "ah80140", "ah81131", "ah81k144", "ah81k144wfklappe", "ah82150a", "ah82150f", "ah83150q", "ah83159", "ah85l120", "ah88k130", "ah88k136", "ah93156", "ah93157", "ah93k130", "ah93k131", "ah93k132", "ah93w145", "ah93w174", "ah93w215", "ah93w257", "ah93w300", "ah93w480b", "ah94145", "ah94156", "ah94w301", "ah95160", "ames01", "ames02", "ames03", "amsoil1", "amsoil2", "apex16", "apex16_nasa_cr-201062", "aquilasm", "arad10", "arad13", "arad20", "arad6", "as5045", "as5046", "as5048", "as6091", "as6092", "as6093", "as6094", "as6095", "as6096", "as6097", "whitcomb"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache apt archives (OpenFOAM/CalculiX/xfoil .deb downloads)
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-openfoam12-calculix-xfoil-jammy-v1

      - name: Install system dependencies (OpenFOAM 12, CalculiX, xfoil, gmsh headless libs)
        run: |
          set -e
          sudo add-apt-repository -y universe
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -q -O - https://dl.openfoam.org/gpg.key | sudo tee /etc/apt/trusted.gpg.d/openfoam.asc > /dev/null
          echo "deb http://dl.openfoam.org/ubuntu jammy main" | sudo tee /etc/apt/sources.list.d/openfoam.list
          sudo apt-get update
          sudo apt-get install -y openfoam12 calculix-ccx xfoil \
            libglu1-mesa libxrender1 libxcursor1 libxft2 libxinerama1

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-airfoil-pipeline-deps-v1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy gmsh h5py pyvista requests beautifulsoup4 lxml

      - name: Run ${{ matrix.airfoil }} through the full pipeline
        run: python scripts/ci_run_airfoil.py ${{ matrix.airfoil }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ matrix.airfoil }}
          path: ci_results/${{ matrix.airfoil }}.json
          retention-days: 14
          if-no-files-found: warn

  summarize:
    needs: run-airfoil
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: ci_results
          merge-multiple: true

      - name: Summarize convergence across the batch
        run: |
          python3 - <<'PYEOF'
          import json
          import glob

          files = sorted(glob.glob("ci_results/*.json"))
          n_success = n_failed = n_converged_total = n_aoa_total = 0
          failures = []
          for path in files:
              with open(path) as f:
                  r = json.load(f)
              if r.get("status") == "success":
                  n_success += 1
                  n_converged_total += r.get("n_converged", 0)
                  n_aoa_total += r.get("n_total", 0)
              else:
                  n_failed += 1
                  failures.append((r.get("name"), r.get("failure_category"), r.get("error", "")[:200]))

          print(f"{len(files)} airfoils reported, {n_success} ran (pipeline-level), {n_failed} failed before aggregation")
          print(f"AoA convergence across successful airfoils: {n_converged_total}/{n_aoa_total}")
          if failures:
              print("\nPipeline-level failures (geometry_mesh/other, not AoA non-convergence):")
              for name, category, err in failures:
                  print(f"  {name} [{category}]: {err}")
          PYEOF
