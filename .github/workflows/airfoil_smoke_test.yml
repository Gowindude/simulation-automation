# Locked target (see conversation / commit message this shipped with):
# ONE real airfoil (naca0012) through the full Stage 0-9 pipeline,
# natively on a Linux runner (no WSL -- see pipeline/_shell.py), landing
# a real .h5 with at least one converged AoA. This is deliberately
# scoped to a single airfoil and manual trigger only, before any matrix
# fan-out over more airfoils -- per the project's own "propose the
# verification target, then build to it" convention
# (.claude/airfoil_pipeline_build_spec.md).
#
# The apt install steps below are cross-checked (not just docs-guessed)
# against this project's own working WSL environment, which runs the
# exact same OpenFOAM 12 / CalculiX / xfoil stack via `wsl.exe` locally:
#   - Ubuntu 22.04 (jammy) confirmed via `lsb_release -a` in that WSL
#     instance -- runs-on is pinned to ubuntu-22.04, not ubuntu-latest
#     (now 24.04/noble), since OpenFOAM Foundation's apt repo isn't
#     confirmed to publish noble packages.
#   - `deb http://dl.openfoam.org/ubuntu jammy main` is the exact,
#     already-working source line from that WSL's own
#     /etc/apt/sources.list.d/ -- hardcoded here rather than relying on
#     add-apt-repository's codename auto-detection.
#   - calculix-ccx (2.17-3) and xfoil (6.99.dfsg+1-3) confirmed via
#     `apt-cache policy` to come from Ubuntu's own jammy/universe repo,
#     not a third-party source -- no extra repo needed for those, just
#     `universe` enabled (present by default on GH's runner images, but
#     enabled explicitly below in case that ever changes).
# This is the strongest verification possible without an actual runner;
# gmsh's own pip-installed headless GL deps and the real solve itself
# are still unverified until the first live run.
name: Airfoil pipeline smoke test (single airfoil)

on:
  workflow_dispatch: {}

jobs:
  smoke-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (OpenFOAM 12, CalculiX, xfoil, gmsh headless libs)
        run: |
          set -e
          sudo add-apt-repository -y universe
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          # OpenFOAM Foundation's own apt repo -- installs to /opt/openfoam12,
          # matching pipeline/_shell.py's hardcoded `source /opt/openfoam12/etc/bashrc`.
          # Key + source line match this project's own working WSL install
          # exactly (see header comment above), not just OpenFOAM's docs.
          wget -q -O - https://dl.openfoam.org/gpg.key | sudo tee /etc/apt/trusted.gpg.d/openfoam.asc > /dev/null
          echo "deb http://dl.openfoam.org/ubuntu jammy main" | sudo tee /etc/apt/sources.list.d/openfoam.list
          sudo apt-get update
          sudo apt-get install -y openfoam12 calculix-ccx xfoil \
            libglu1-mesa libxrender1 libxcursor1 libxft2 libxinerama1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy gmsh h5py pyvista requests beautifulsoup4 lxml pytest

      - name: Run single-airfoil pipeline smoke test (naca0012, real solve)
        run: |
          python - <<'PYEOF'
          import json
          from pipeline.orchestrator import run_single_airfoil

          spec = {"name": "naca0012", "dat_path": "tests/fixtures/naca0012.dat"}
          result = run_single_airfoil(spec, ".orchestrator_runs/ci_smoke")

          summary = {k: v for k, v in result.items() if k != "per_aoa_results"}
          print(json.dumps(summary, indent=2, default=str))

          assert result["status"] == "success", f"pipeline failed: {result.get('error')}"
          assert result["n_converged"] >= 1, "no AoA converged -- 0/5 is not a passing smoke test"
          assert result["h5_path"], "no .h5 written"
          PYEOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: naca0012-smoke-test-output
          path: .orchestrator_runs/ci_smoke/
          retention-days: 7
