# Locked target: 256 G2Aero real-airfoil shapes (NREL curated_airfoils.npz
# real subset, already deduped against UIUC and verified through Stage 0
# -- see data/g2aero_downloader.py / STATUS.md), each as its own matrix
# job. 256 is GitHub Actions' hard per-matrix job cap, not an arbitrary
# choice -- the full 358-shape G2Aero set needs a second batch later for
# the remaining ~102.
#
# Same install/cache/upload approach as airfoil_matrix_run.yml
# (verified working there for real, including the .h5 upload fix).
name: Airfoil corpus matrix run (G2Aero batch 1)

on:
  workflow_dispatch: {}

jobs:
  run-airfoil:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 20
